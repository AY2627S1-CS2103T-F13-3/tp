plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'ponhub.Main'
}

run {
    enableAssertions = true
}

version = '1.6'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()
    testLogging.exceptionFormat = 'full'
    doFirst {
        systemProperty 'ponhub.test.runtimeClasspath', sourceSets.test.runtimeClasspath.asPath
    }
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    archiveFileName = 'ponhub.jar'
    from('LICENSE') {
        into 'META-INF/licenses/ponhub'
    }
    from('licenses') {
        into 'META-INF/licenses'
    }
    // Keep each resolved Jackson component's notices, even when names collide.
    project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        if (artifact.moduleVersion.id.group.startsWith('com.fasterxml.jackson')) {
            from(zipTree(artifact.file)) {
                include 'META-INF/LICENSE*', 'META-INF/NOTICE*'
                into "META-INF/licenses/${artifact.name}-${artifact.moduleVersion.id.version}"
            }
        }
    }
    manifest {
        attributes(
                'Implementation-Title': 'PonHub',
                'Implementation-Version': project.version
        )
    }
}

tasks.register('verifyPackagedLicenses') {
    group = 'verification'
    description = 'Compare packaged project and dependency notices with their source bytes.'
    dependsOn shadowJar
    doLast {
        def expected = ['META-INF/licenses/ponhub/LICENSE': file('LICENSE').bytes,
                        'audio/LICENSE.txt': file('src/main/resources/audio/LICENSE.txt').bytes]
        fileTree('licenses').files.each { notice ->
            def relative = file('licenses').toPath().relativize(notice.toPath()).toString().replace('\\', '/')
            expected["META-INF/licenses/${relative}".toString()] = notice.bytes
        }
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            if (artifact.moduleVersion.id.group.startsWith('com.fasterxml.jackson')) {
                new java.util.zip.ZipFile(artifact.file).withCloseable { dependency ->
                    def notices = dependency.entries().findAll {
                        it.name ==~ /META-INF\/(LICENSE|NOTICE).*/ && !it.directory
                    }
                    if (notices.empty) {
                        throw new GradleException("No notices found in ${artifact.file.name}")
                    }
                    notices.each { notice ->
                        def prefix = "META-INF/licenses/${artifact.name}-${artifact.moduleVersion.id.version}/"
                        expected[(prefix + notice.name).toString()] = dependency.getInputStream(notice).bytes
                    }
                }
            }
        }
        new java.util.zip.ZipFile(shadowJar.archiveFile.get().asFile).withCloseable { packaged ->
            expected.each { path, bytes ->
                def matches = packaged.entries().findAll { it.name == path }
                if (matches.size() != 1 || !Arrays.equals(bytes, packaged.getInputStream(matches.first()).bytes)) {
                    throw new GradleException("Missing, duplicated or changed packaged notice: ${path}")
                }
            }
        }
        logger.lifecycle("Verified ${expected.size()} packaged licence/notice files byte for byte.")
    }
}

check.dependsOn verifyPackagedLicenses

defaultTasks 'clean', 'test'
